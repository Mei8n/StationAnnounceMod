buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
    }
    dependencies {
        classpath 'com.anatawa12.forge:ForgeGradle:1.2-1.1.1'
    }
}

tasks.named('wrapper', Wrapper) {
    gradleVersion = '7.6.3'
    distributionType = Wrapper.DistributionType.BIN
    distributionSha256Sum = '740c2e472ee4326c33bf75a5c9f5cd1e69ecf3f9b580f6e236c86d1f3d98cfac'
}

configurations {
    embed
    compile.extendsFrom(embed)
}

apply plugin: 'forge'
apply plugin: 'maven-publish'

def coreSource = file("src/main/java/jp/me1han/sam/StationAnnounceModCore.java").text
def modId = (coreSource =~ /MOD_ID\s*=\s*"([^"]+)"/)[0][1]
def modName = (coreSource =~ /MOD_NAME\s*=\s*"([^"]+)"/)[0][1]
def releaseVersion = (coreSource =~ /VERSION\s*=\s*"([^"]+)"/)[0][1]

def releaseTaskRequested = gradle.startParameter.taskNames.any { requested ->
    def taskName = requested.tokenize(':').last()
    taskName == 'buildRelease' || taskName == 'verifyReleaseMetadata'
}
version = releaseTaskRequested ? releaseVersion : "SNAPSHOT"
group = "jp.me1han.sam"
archivesBaseName = "stationannouncemod"

ext.set('modId', modId)
ext.set('modName', modName)

minecraft {
    version = "1.7.10-10.13.4.1614-1.7.10"
    runDir = project.hasProperty("noMods") ? "run/noMod" : "run"
}

def preloadKotlinJar = file("$projectDir/libs/aaaa-preload-newer-kotlin-2.3.20.jar")
def sanitizedPreloadKotlinJarPath = "$buildDir/runtime-libs/aaaa-preload-newer-kotlin-2.3.20-sanitized.jar"

tasks.register("sanitizePreloadKotlinJar", Jar) {
    onlyIf { preloadKotlinJar.exists() }
    archiveFileName = "aaaa-preload-newer-kotlin-2.3.20-sanitized.jar"
    destinationDirectory = file("$buildDir/runtime-libs")

    from(zipTree(preloadKotlinJar)) {
        exclude "META-INF/versions/**", "META-INF/MANIFEST.MF", "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
    }
}

tasks.withType(JavaExec).configureEach { execTask ->
    if (execTask.name == "runClient") {
        execTask.dependsOn("sanitizePreloadKotlinJar")
        execTask.doFirst {
            if (preloadKotlinJar.exists()) {
                def sanitizedPreloadKotlinJar = file(sanitizedPreloadKotlinJarPath)
                classpath = files(classpath.files.collect { f ->
                    f.canonicalFile == preloadKotlinJar.canonicalFile ? sanitizedPreloadKotlinJar : f
                })
            }

            classpath = files(classpath.files.findAll { f ->
                f.canonicalFile != preloadKotlinJar.canonicalFile
            })
        }
    }
}

if (project.hasProperty("noMods")) {
    def noModsRunDir = file("$projectDir/run/noMod")

    tasks.register("prepareNoModsRunDir") {
        doLast {
            file("$noModsRunDir/mods").mkdirs()
            file("$noModsRunDir/config").mkdirs()
        }
    }

    tasks.matching { it.name == "makeStart" }.configureEach {
        outputs.upToDateWhen { false }
    }

    tasks.withType(JavaExec).configureEach { execTask ->
        if (execTask.name == "runClient") {
            execTask.dependsOn("prepareNoModsRunDir")
            execTask.doFirst {
                workingDir = noModsRunDir

                def filteredArgs = []
                def originalArgs = args ?: []
                for (int i = 0; i < originalArgs.size(); i++) {
                    if (i < originalArgs.size() - 1 && originalArgs[i] == "--gameDir") {
                        i++
                        continue
                    }
                    filteredArgs << originalArgs[i]
                }
                filteredArgs += ["--gameDir", noModsRunDir.absolutePath]
                setArgs(filteredArgs)

                def libsDir = file("$projectDir/libs").canonicalFile
                def libsPrefix = libsDir.path + File.separator
                classpath = files(classpath.files.findAll { f ->
                    def path = f.canonicalPath
                    !(path == libsDir.path || path.startsWith(libsPrefix))
                })
            }
        }
    }
}

dependencies {
}

processResources {
    inputs.property "modId", project.modId
    inputs.property "modName", project.modName
    inputs.property "modVersion", project.version
    inputs.property "minecraftVersion", project.minecraft.version

    filesMatching('mcmod.info') {
        expand 'modId': project.modId, 'modName': project.modName,
               'modVersion': project.version, 'minecraftVersion': project.minecraft.version
    }
}

tasks.withType(Jar) {
    compileJava.options.encoding = 'UTF-8'
}

sourceCompatibility = "1.8"
targetCompatibility = "1.8"

jar {
    configurations.embed.each { dep ->
        from(project.zipTree(dep)) {
            exclude 'META-INF', 'META-INF/versions/**', 'META-INF/maven/**'
        }
    }

    from(rootDir) {
        include 'README.md'
        include 'howtoDepartureMelody.md'
        include 'howtoAddAnnounce.md'
        include 'SCRIPT_RUNTIME.md'
        include 'CHANGELOG.md'
        include 'howtoAwarenessAnnouncer.md'
        include 'howtoSpeakerModels.md'
        include 'howtoStationNameAnnouncer.md'
        include 'LICENSE'
    }

    manifest {
        attributes(
            "FMLCorePluginContainsFMLMod": "true",
            "ForceLoadAsMod": "true"
        )
    }
}

task deobfJar(type: Jar) {
    from sourceSets.main.output
    classifier = 'dev'
}

task sourcesJar(type: Jar) {
    from sourceSets.main.allSource
    classifier = 'sources'
}

repositories {
    mavenCentral()
}

build.dependsOn deobfJar

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            artifact sourcesJar {
                classifier = 'sources'
                extension = 'jar'
            }
            artifact deobfJar {
                classifier = 'dev'
                extension = 'jar'
            }
        }
    }
}

task runClientDev {
    dependsOn 'runClient'
}

tasks.register('buildRelease') {
    group = 'build'
    dependsOn 'build'
}

tasks.register('verifyReleaseMetadata') {
    group = 'verification'
    description = 'Build the release artifact and verify its filename and embedded mcmod.info version.'
    dependsOn 'buildRelease'

    doLast {
        if (project.version.toString() != releaseVersion)
            throw new GradleException("Release project version mismatch: ${project.version} != ${releaseVersion}")
        def releaseJar = tasks.named('jar').get().archiveFile.get().asFile
        def expectedJarName = "${archivesBaseName}-${releaseVersion}.jar"
        if (releaseJar.name != expectedJarName)
            throw new GradleException("Release artifact filename mismatch: ${releaseJar.name}")
        def zip = new java.util.zip.ZipFile(releaseJar)
        try {
            def entry = zip.getEntry('mcmod.info')
            if (entry == null) throw new GradleException('Release artifact has no mcmod.info')
            def metadata = new groovy.json.JsonSlurper().parse(zip.getInputStream(entry))
            def embeddedVersion = metadata?.modList instanceof List && !metadata.modList.isEmpty()
                ? metadata.modList[0].version : null
            if (embeddedVersion != releaseVersion)
                throw new GradleException("mcmod.info version mismatch: ${embeddedVersion} != ${releaseVersion}")
            ['README.md', 'howtoDepartureMelody.md', 'howtoAddAnnounce.md', 'SCRIPT_RUNTIME.md',
             'CHANGELOG.md', 'howtoAwarenessAnnouncer.md', 'howtoSpeakerModels.md',
             'howtoStationNameAnnouncer.md', 'LICENSE'].each { document ->
                if (zip.getEntry(document) == null)
                    throw new GradleException("Release artifact has no document: ${document}")
            }
        } finally {
            zip.close()
        }
        logger.lifecycle("Verified release metadata: ${releaseJar.name}, version ${releaseVersion}, 9 documents")
    }
}

tasks.register('verifyBuildEnvironment') {
    group = 'verification'
    description = 'Require the repository Gradle version and Java 8 runtime.'

    doLast {
        def expectedGradle = '7.6.3'
        def actualGradle = gradle.gradleVersion
        if (actualGradle != expectedGradle) {
            throw new GradleException("Unsupported Gradle runtime: expected ${expectedGradle}, actual ${actualGradle}")
        }

        def expectedJava = 'Java 8'
        def actualJava = System.getProperty('java.version')
        if (JavaVersion.current() != JavaVersion.VERSION_1_8) {
            throw new GradleException("Unsupported Java runtime: expected ${expectedJava}, actual ${actualJava}")
        }
    }
}
check.dependsOn verifyBuildEnvironment

tasks.register('verifyDeparture', JavaExec) {
    group = 'verification'
    description = 'Check departure timing, external JavaScript/JSON and network round trips.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jp.me1han.sam.DeparturePlaybackTest'
}
check.dependsOn verifyDeparture

tasks.register('verifySwitchModels', JavaExec) {
    group = 'verification'
    description = 'Check switch JSON/MQO, independent controls and portable metadata.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jp.me1han.sam.SwitchModelTest'
    workingDir = projectDir
}
check.dependsOn verifySwitchModels

tasks.register('verifySpeakerModels', JavaExec) {
    group = 'verification'
    description = 'Check Speaker model JSON, optional rendering configuration and placement metadata.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jp.me1han.sam.SpeakerModelTest'
    workingDir = projectDir
}
check.dependsOn verifySpeakerModels

tasks.register('verifyNetwork', JavaExec) {
    group = 'verification'
    description = 'Check speaker lifecycle, bounded packets, recipient routing, GUI validation and client session ordering.'
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'jp.me1han.sam.network.NetworkVerificationTest'
}
check.dependsOn verifyNetwork

tasks.register('verifyOptionalRtmBoundary') {
    group = 'verification'
    description = 'Reject compile-time links from SAM classes to optional RTM classes.'
    dependsOn compileJava

    doLast {
        def forbiddenInternalName = 'jp/ngt/rtm/'
        def linkedClasses = fileTree("$buildDir/classes/java/main") {
            include '**/*.class'
        }.findAll { classFile ->
            new String(classFile.bytes, 'ISO-8859-1').contains(forbiddenInternalName)
        }

        if (!linkedClasses.isEmpty()) {
            def names = linkedClasses.collect {
                file("$buildDir/classes/java/main").toPath().relativize(it.toPath()).toString()
            }.join(', ')
            throw new GradleException("Optional RTM classes are linked at compile time: $names")
        }
    }
}
check.dependsOn verifyOptionalRtmBoundary
